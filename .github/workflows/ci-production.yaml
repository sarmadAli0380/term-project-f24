name: wf-ci-production
on:
  push:
    branches:
      - production
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: lint HTML and CSS
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
  build-job:
    needs: lint-job
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: Build with Parcel
        run: npx parcel build "./src/index.html" --dist-dir "./production" --public-url "./"